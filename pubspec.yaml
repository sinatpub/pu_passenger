name: com.tara.passenger
description: "Tara Passenger is mobile application reserve for passenger"

publish_to: 'none'

#version: 1.2.1+1211 # android
version: 1.1.8+1181 # iOS
# 1.0.2 → version name (user-facing)
# +5    → build number (versionCode, must increase with every Play Store upload)

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  arc_text: ^0.0.3
  # state management
  flutter_bloc: ^8.1.6

  # dependency injection in bloc
  get_it: ^7.7.0

  dartz: ^0.10.1
  # network
  http: ^1.2.2
  # svg icon-
  flutter_svg: ^2.0.10+1
  # toggle switch button
  flutter_switch: ^0.3.2

  dotted_line: ^3.2.2
  # get current location and permission location
  geolocator: ^10.1.0
  # decode latlng to address
  geocoding: ^3.0.0
  # location stream listener
#  location: ^6.0.1
  # google map
  google_maps_flutter: ^2.6.1
  # platform
  google_maps_flutter_platform_interface: ^2.11.1
  # draw polyline on google map
  flutter_polyline_points: ^2.1.0
  # translation
  flutter_local_notifications: ^18.0.0
  # vibrate
  vibration: ^2.0.1
  # print
  logger: ^2.4.0
  # pinput otp
  pinput: ^5.0.0

  # auto fill otp
  smart_auth: ^3.2.0
  # dot container
  dotted_border: ^2.1.0
  # dropdown button
  dropdown_button2: ^2.3.9
  # image picker 
  image_picker: ^1.1.1
  # permission
  permission_handler: ^11.3.1
  # network request
  dio: ^5.7.0
  # logger 
  pretty_dio_logger: ^1.4.0
  # socket io client 
  socket_io_client: ^3.0.0
  # device info
  device_info_plus: ^11.0.0

  flutter_arc_text: ^0.6.0
  # local storage
  shared_preferences: ^2.3.2
  # get version from pubspec.yaml
  package_info_plus: ^8.1.2
  # launcher url
  url_launcher: ^6.3.1
  # state management
  get: ^4.6.6
  # snackbar toast
  toastification: ^2.3.0
  # loading
  flutter_easyloading: ^3.0.5
  # dismiss keyboard
  keyboard_dismisser: ^3.0.0
  # translation
  localization: ^2.1.1
  # internet connectivity
#  connectivity_plus: ^6.1.3
  # pagination scroll  
  infinite_scroll_pagination: ^4.0.0
  # date format
  intl: ^0.20.2
  # Shimmer Effect
  shimmer: ^3.0.0
  # cached image
  cached_network_image: ^3.4.1
   # Countdown
  slide_countdown: ^2.0.0
  # compare on marker google map
  flutter_compass: ^0.8.1

  # firebase packages
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
#  flutter_local_notifications: ^19.5.0
  firebase_crashlytics: ^5.0.7
#  firebase_analytics: ^12.0.4



#dependency_overrides:
#  source_gen: ^2.0.0
#  flutter_local_notifications: ^19.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/marker/
    - assets/image/
    - assets/image/country/
    - assets/image/png/
    - assets/image/svg/
    - assets/icon/svg/
    - assets/icon/png/
    - assets/nav_icon/
    - assets/sounds/booking_sound.wav
    - ios/Runner/booking_sound.wav


  fonts:
    - family: KhmerMoul
      fonts:
        - asset: fonts/moul_regular.ttf
    - family: TimesNewRomance
      fonts:
        - asset: fonts/timesNewRomance.ttf
    - family: KantumruyPro
      fonts:
        - asset: fonts/KantumruyPro-VariableFont_wght.ttf
    - family: KantumruyPro-SemiBold
      fonts:
        - asset: fonts/KantumruyPro-SemiBold.ttf
    - family: KantumruyPro-Regular
      fonts:
        - asset: fonts/KantumruyPro-Regular.ttf

